---
services:
  # Redis server for docker-hermes
  redis:
    image: redis:7-alpine
    container_name: docker-hermes-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hermes-network

  # docker-hermes server
  hermes-server:
    build:
      context: ../..
      dockerfile: docker-hermes/Dockerfile
    container_name: docker-hermes-server
    ports:
      - "8080:8080"
    command: [server]
    environment:
      - CONFIG_TYPE=env
      - REDIS_URL=redis://redis:6379
      - HTTP_LISTEN_ADDRESS=:8080
      - PROMETHEUS_SD_PATH=/prometheus/sd
      - TRACING_ENABLED=false
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hermes-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # docker-hermes agent on host1
  hermes-agent-1:
    build:
      context: ../..
      dockerfile: docker-hermes/Dockerfile
    container_name: docker-hermes-agent-1
    ports:
      - "9091:9090" # Metrics port
    command: [agent]
    environment:
      - CONFIG_TYPE=env
      - REDIS_URL=redis://redis:6379
      - DOCKER_SOCKET=unix:///var/run/docker.sock
      - HOSTNAME=host1
      - LABEL_PREFIX=
      - HEARTBEAT_INTERVAL=15s
      - TRACING_ENABLED=false
      - LOG_LEVEL=debug
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "943" # docker group id
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hermes-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/metrics",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  # docker-hermes agent on host2
  hermes-agent-2:
    build:
      context: ../..
      dockerfile: docker-hermes/Dockerfile
    container_name: docker-hermes-agent-2
    ports:
      - "9092:9090" # Metrics port
    command: [agent]
    environment:
      - CONFIG_TYPE=env
      - REDIS_URL=redis://redis:6379
      - DOCKER_SOCKET=unix:///var/run/docker.sock
      - HOSTNAME=host2
      - LABEL_PREFIX=
      - HEARTBEAT_INTERVAL=15s
      - TRACING_ENABLED=false
      - LOG_LEVEL=debug
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "943" # docker group id
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hermes-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/metrics",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  # Test application 1 - with Prometheus metrics
  test-app-1:
    image: nginx:alpine
    container_name: test-app-1
    ports:
      - "8001:80"
    labels:
      - "app=nginx"
      - "environment=test"
      - "version=1.0"
      # explicitly defined port
      - "hermes.prometheus.scrape=true"
      - "hermes.prometheus.port=8001"
      - "hermes.prometheus.path=/metrics"
      - "hermes.prometheus.scheme=http"
    networks:
      - hermes-network

  # Test application 2 - with Prometheus metrics
  test-app-2:
    image: nginx:alpine
    container_name: test-app-2
    ports:
      - "8002:80"
    labels:
      - "app=nginx"
      - "environment=test"
      - "version=2.0"
      # implicitly defined port
      - "hermes.prometheus.scrape=true"
      - "hermes.prometheus.path=/metrics"
      - "hermes.prometheus.scheme=http"
    networks:
      - hermes-network

  # Test application 3 - without Prometheus metrics
  test-app-3:
    image: nginx:alpine
    container_name: test-app-3
    ports:
      - "8003:80"
    labels:
      - "app=nginx"
      - "environment=test"
      - "version=3.0"
      - "no-prometheus=true"
    networks:
      - hermes-network

  # Prometheus for testing HTTP SD
  prometheus:
    image: prom/prometheus:latest
    container_name: docker-hermes-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    depends_on:
      hermes-server:
        condition: service_healthy
    networks:
      - hermes-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: docker-hermes-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    labels:
      - "hermes.prometheus.scrape=true"
      - "hermes.prometheus.port=3000"
      - "hermes.prometheus.path=/metrics"
      - "hermes.prometheus.scheme=http"
    networks:
      - hermes-network

  # Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: docker-hermes-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hermes-network

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  hermes-network:
    driver: bridge
